name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create GitHub Release
      id-token: write # required for npm provenance and MCP Registry OIDC login

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run check

      # A tag precisa bater com a versão do package.json: é ela que vai para o npm
      # e para o MCP Registry, então divergência aqui publicaria versões diferentes.
      - name: Check that the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::A tag v$TAG_VERSION não bate com a versão $PKG_VERSION do package.json"
            exit 1
          fi

      # Uma versão já publicada à mão (a 0.1.0 foi) não se publica de novo: o npm recusa,
      # e o MCP Registry também. O tag então só marca a versão e cria a Release.
      - name: Check what is already published
        id: publicado
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p "require('./package.json').name")"
          MCP_NAME="$(node -p "require('./package.json').mcpName")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "npm=true" >> "$GITHUB_OUTPUT"; else echo "npm=false" >> "$GITHUB_OUTPUT"; fi
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=$MCP_NAME" | jq -e --arg v "$VERSION" '[.servers[] | (.server // .) | select(.version == $v)] | length > 0' >/dev/null; then echo "registry=true" >> "$GITHUB_OUTPUT"; else echo "registry=false" >> "$GITHUB_OUTPUT"; fi

      # Publish to npmjs.com
      - if: steps.publicado.outputs.npm == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # Publish to the Official MCP Registry (registry.modelcontextprotocol.io).
      # O registry só guarda metadados: ele lê o mcpName do pacote já publicado no npm.
      - name: Install mcp-publisher
        if: steps.publicado.outputs.registry == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version with the tag
        if: steps.publicado.outputs.registry == 'false'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Validate server.json
        if: steps.publicado.outputs.registry == 'false'
        run: ./mcp-publisher validate

      # OIDC do GitHub Actions: sem token guardado em secrets.
      - name: Authenticate to MCP Registry
        if: steps.publicado.outputs.registry == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.publicado.outputs.registry == 'false'
        run: ./mcp-publisher publish
